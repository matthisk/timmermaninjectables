name = "nt-clinic"
compatibility_date = "2026-11-10"
# Both generated by build.mjs: the Worker adds security headers around static assets.
main = "./dist/server/index.js"

[assets]
directory = "./dist/client"
binding = "ASSETS"
# Route every request through the Worker so security headers apply to assets too.
run_worker_first = true

[vars]
# Read by build.mjs at build time (the build step does not see [vars] otherwise).
# Used for canonical/og/hreflang URLs and the Calendly embed domain.
SITE_URL = "https://ntclinic.nl"
